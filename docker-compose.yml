services:
  nextjs:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://tipchain.lostmedia.pro}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://tipchain.lostmedia.pro/api}
    container_name: sawer-nextjs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://sawer-api:8080/api
      AUTH_URL: ${AUTH_URL:-https://tipchain.lostmedia.pro}
      AUTH_TRUST_HOST: "true"
    networks:
      - media_backend

  api:
    build:
      context: ./backend
    container_name: sawer-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:supersecretpassword30charslong123@postgres:5432/mediashare?sslmode=disable}
    networks:
      - media_backend

networks:
  media_backend:
    external: true

