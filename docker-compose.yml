services:
  nextjs:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        API_INTERNAL_URL: http://sawer-api:8080/api

    container_name: sawer-nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://sawer-api:8080/api
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
    networks:
      - media_backend


  api:
    build:
      context: ./backend
    container_name: sawer-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:supersecretpassword30charslong123@media-postgres-prod:5432/mediashare?sslmode=disable}

    networks:
      - media_backend




networks:
  media_backend:
    external: true

volumes: {}
