apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - datasourceUid: loki
          matcherRegex: '"request_id":"([^"]+)"'
          name: request_id
          url: "$${__value.raw}"
          matcherType: regex
        - datasourceUid: loki
          matcherRegex: '"user_id":"([^"]+)"'
          name: user_id
          url: "$${__value.raw}"
          matcherType: regex

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      timeInterval: 15s
