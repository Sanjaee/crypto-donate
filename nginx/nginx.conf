events {}

http {
  # Docker embedded DNS.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Rate limit: widget polling & auth.
  limit_req_zone $binary_remote_addr zone=widgets:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=donations:10m rate=20r/m;

  limit_req_status 429;
  server_tokens off;
  client_max_body_size 5m;

  server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Endpoint auth milik Go API (register/login). Prefix lebih panjang
    # dari /api/auth/ sehingga menang dalam pencocokan nginx.
    location /api/auth/register {
      set $api_upstream http://api:8080;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/login {
      set $api_upstream http://api:8080;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth.js routes (Next.js): csrf, signin, callback, session, providers, ...
    location /api/auth/ {
      set $nextjs_upstream http://nextjs:3000;
      proxy_pass $nextjs_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # API Go (public + internal endpoints) — BELAKANG /api/auth/
    location /api/ {
      set $api_upstream http://api:8080;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook Plisio (crypto payment, tidak di-rate limit ketat)
    location /webhooks/ {
      set $api_upstream http://api:8080;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
      set $api_upstream http://api:8080;
      proxy_pass $api_upstream;
    }

    # Widget polling (rate limit khusus)
    location ~ ^/api/widgets/mediashare/(media|config|.*/complete) {
      limit_req zone=widgets burst=20 nodelay;
      set $api_upstream http://api:8080;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Widget SSE realtime (tanpa buffering, koneksi panjang)
    location ~ ^/api/widgets/mediashare/stream {
      set $api_upstream http://api:8080;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding off;
    }

    # Semua yang lain -> Next.js
    location / {
      set $nextjs_upstream http://nextjs:3000;
      proxy_pass $nextjs_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
